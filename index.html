<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ For Roaa ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#050505,#161616);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
color:white;
padding:20px;
}

.container{
width:100%;
max-width:420px;
background:#111;
border:2px solid crimson;
border-radius:25px;
padding:30px;
text-align:center;
box-shadow:0 0 30px rgba(255,0,60,.6);
position:relative;
z-index:2;
animation:show .8s ease;
}

@keyframes show{
from{
opacity:0;
transform:scale(.9);
}
to{
opacity:1;
transform:scale(1);
}
}

.logo{
font-size:70px;
margin-bottom:10px;
animation:heart 1.3s infinite;
}

@keyframes heart{
0%,100%{transform:scale(1);}
50%{transform:scale(1.15);}
}

h1{
color:#ff2d55;
margin-bottom:15px;
font-size:32px;
}

p{
line-height:2;
color:#ddd;
font-size:18px;
margin-bottom:15px;
}

.dev{
margin-top:20px;
padding:15px;
border-radius:15px;
background:#1b1b1b;
border:1px solid #333;
font-size:15px;
color:#bbb;
}

button{
margin-top:25px;
width:100%;
padding:16px;
font-size:20px;
border:none;
border-radius:15px;
background:crimson;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
box-shadow:0 0 20px crimson;
}

button:active{
transform:scale(.98);
}

.heart{
position:absolute;
top:-30px;
color:#ff2d55;
font-size:25px;
animation:fall linear infinite;
pointer-events:none;
}

@keyframes fall{
0%{
transform:translateY(-100px);
opacity:1;
}
100%{
transform:translateY(120vh);
opacity:0;
}
}

@media(max-width:600px){

.container{
padding:22px;
}

h1{
font-size:28px;
}

p{
font-size:16px;
}

button{
font-size:18px;
padding:15px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="logo">❤️</div>

<h1>يا رؤى 🌹</h1>

<p>
عملتلك حاجة صغيرة...
يمكن متبقاش أكبر هدية،
بس اتعملت بكل حب مخصوص ليكي. ❤️
</p>

<p>
قدامك اختبار بسيط عن ذكرياتنا سوا...
ولو جاوبتي كل الأسئلة صح،
هتوصلي لهدية مخبية ليكي. 🎁
</p>

<div class="dev">
🖥️ تم تصميم التجربة دي بالكامل بواسطة<br><br>
<b>Youssef Mohammed</b><br><br>
Private Build • Version 2.0
</div>

<button onclick="window.location='quiz.html'">
🚀 ابدأي الاختبار
</button>

</div>

<script>

function createHeart(){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(3+Math.random()*5)+"s";

heart.style.fontSize=(20+Math.random()*25)+"px";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

}

setInterval(createHeart,250);

</script>

</body>
</html>
