<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ For Roaa ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#090909;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
color:white;
}

.container{
width:90%;
max-width:650px;
background:#111;
border:2px solid #ff003c;
padding:35px;
border-radius:25px;
box-shadow:0 0 40px #ff003c;
text-align:center;
animation:fade 1.2s;
}

@keyframes fade{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}

h1{
font-size:40px;
color:#ff2e63;
margin-bottom:20px;
}

p{
font-size:21px;
line-height:2;
margin-bottom:15px;
}

button{

margin-top:20px;
padding:15px 40px;
font-size:22px;
border:none;
border-radius:40px;
cursor:pointer;
background:#ff003c;
color:white;
transition:.3s;

}

button:hover{

transform:scale(1.07);

box-shadow:0 0 30px red;

}

.footer{

margin-top:30px;
font-size:17px;
color:#ddd;

}

.heart{

position:absolute;

color:#ff2e63;

animation:fall linear infinite;

}

@keyframes fall{

0%{
transform:translateY(-100px);
opacity:1;
}

100%{
transform:translateY(110vh);
opacity:0;
}

}

</style>

</head>

<body>

<div class="container">

<h1>❤️ Welcome, Roaa ❤️</h1>

<p>

تم تصميم التجربة دي مخصوص ليكي... ❤️

</p>

<p>

دي مش مجرد صفحة...
ولا مجرد اختبار...

دي هدية صغيرة اتعملت بكل حب،
علشان ترسملك ابتسامة. 🥹

</p>

<p>

كل تفصيلة هنا...
اتعملت بإيد شخص بيهتم بيكي جدًا.

</p>

<h2 style="margin-top:25px;color:#ff4d6d;">

🖥️ Developed with ❤️ by

<br><br>

Youssef Mohammed

</h2>

<div class="footer">

Version 1.0

<br>

Private Build For Roaa ❤️

</div>

<button onclick="window.location='quiz.html'">

ابدئي الاختبار ❤️

</button>

</div>

<script>

function createHeart(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(20+Math.random()*30)+"px";

h.style.animationDuration=(3+Math.random()*5)+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},7000);

}

setInterval(createHeart,250);

</script>

</body>
</html>
