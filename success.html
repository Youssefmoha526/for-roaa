<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎁 Your Gift</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{

background:linear-gradient(135deg,#050505,#141414);

color:white;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

overflow-x:hidden;

}

.loader{

text-align:center;

width:100%;

max-width:500px;

}

.loader h1{

color:#ff2d55;

margin-bottom:25px;

font-size:clamp(22px,5vw,35px);

}

.bar{

width:100%;

height:18px;

background:#222;

border-radius:50px;

overflow:hidden;

margin:auto;

box-shadow:0 0 10px #000 inset;

}

.progress{

width:0%;

height:100%;

background:linear-gradient(90deg,#ff003c,#ff4d6d,#ff8800);

transition:.08s;

}

#percent{

margin-top:20px;

font-size:22px;

font-weight:bold;

}

#message{

display:none;

width:100%;

max-width:750px;

background:#111;

padding:30px;

border-radius:25px;

border:2px solid crimson;

box-shadow:0 0 40px rgba(255,0,60,.5);

text-align:center;

animation:fade .8s;

}

@keyframes fade{

from{

opacity:0;

transform:scale(.9);

}

to{

opacity:1;

transform:scale(1);

}

}

h2{

color:#ff4d6d;

margin-bottom:20px;

}

.type{

font-size:clamp(18px,4vw,24px);

line-height:2;

white-space:pre-line;

min-height:220px;

}

button{

margin-top:30px;

padding:16px 35px;

font-size:20px;

background:crimson;

border:none;

border-radius:15px;

color:white;

cursor:pointer;

transition:.3s;

box-shadow:0 0 20px crimson;

}

button:hover{

transform:scale(1.05);

box-shadow:0 0 35px crimson;

}

button:active{

transform:scale(.96);

}

#last{

display:none;

margin-top:35px;

animation:fade 1s;

}

.heart{

position:fixed;

font-size:30px;

pointer-events:none;

animation:fall linear infinite;

}

@keyframes fall{

0%{

transform:translateY(-100px);

opacity:1;

}

100%{

transform:translateY(120vh);

opacity:0;

}

}

@media(max-width:600px){

#message{

padding:20px;

}

button{

width:100%;

}

}

</style>

</head>

<body>

<div class="loader">

<h1>🔒 Decrypting Secret Gift...</h1>

<div class="bar">

<div class="progress" id="progress"></div>

</div>

<div id="percent">0%</div>

</div>

<div id="message">

<h2>🎉 مبروك ❤️</h2>

<p class="type" id="typing"></p>

<button onclick="lastGift()">

💌 افتحي آخر مفاجأة

</button>

<div id="last">

<h1 style="color:#ff2d55;font-size:42px;">

❤️ يوسف × رؤى ❤️

</h1>

<h2>Forever ♾️</h2>

<p style="font-size:24px;margin-top:20px;">
I LOVE YOU ❤️
</p>

<p style="margin-top:20px;color:#bbb;">
Designed & Developed by<br>
<b>Youssef Mohammed</b>
</p>

</div>

</div>

<script>

let progress=0;

const bar=document.getElementById("progress");

const percent=document.getElementById("percent");

const loader=document.querySelector(".loader");

const message=document.getElementById("message");

const typing=document.getElementById("typing");

/* ===========================
   اكتب رسالتك هنا
=========================== */
const text = `لو وصلتي لهنا...
يبقى فعلًا تعرفيني كويس جدًا. ❤️

يمكن الاختبار كان مجرد 6 أسئلة...
لكن بالنسبة ليا كل سؤال كان وراه ذكرى جميلة بينا.

شكراً إنك خدتي وقتك ولعبتي الاختبار.

وجودك في حياتي من أحلى الحاجات اللي حصلتلي،
وبتمنى أشوف ضحكتك كل يوم.

ربنا يديمك في حياتي يا رؤى. ❤️🌹

يمكن الكلام ميكفيش...
بس بجد...

بحبك جدًا. ❤️`;

/* =========================== */

let i=0;
const loading=setInterval(function(){

progress++;

bar.style.width=progress+"%";
percent.innerHTML=progress+"%";

if(progress>=100){

clearInterval(loading);

setTimeout(function(){

loader.style.display="none";
message.style.display="block";

typeWriter();

for(let i=0;i<120;i++){

setTimeout(createConfetti,i*40);

}

},500);

}

},30);

function typeWriter(){

if(i<text.length){

typing.innerHTML+=text.charAt(i);

i++;

setTimeout(typeWriter,35);

}

}

function lastGift(){

let last=document.getElementById("last");

last.style.display="block";

last.style.opacity="0";
last.style.transform="translateY(20px)";

setTimeout(function(){

last.style.transition=".8s";

last.style.opacity="1";

last.style.transform="translateY(0)";

},50);

}

function createHeart(){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*25)+"px";

heart.style.animationDuration=(3+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(function(){

heart.remove();

},8000);

}

setInterval(createHeart,450);

function createConfetti(){

let c=document.createElement("div");

const shapes=["🎉","✨","❤️","🎊"];

c.innerHTML=shapes[Math.floor(Math.random()*shapes.length)];

c.style.position="fixed";

c.style.left=Math.random()*100+"vw";

c.style.top="-40px";

c.style.fontSize=(18+Math.random()*18)+"px";

c.style.pointerEvents="none";

c.style.animation="fall "+(2+Math.random()*3)+"s linear";

document.body.appendChild(c);

setTimeout(function(){

c.remove();

},5000);

}

</script>

</body>

</html>
